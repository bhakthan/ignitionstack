[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ignitionstack"
version = "0.1.0"
description = "Use Case → Production Azure Workload — the IgnitionStack Agent pattern template"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Open Agent School Contributors"},
]
keywords = ["ai", "agents", "azure", "iac", "bicep", "scaffold", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=1.40",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "PyPDF2>=3.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
ignition = "ignition.cli:main"

[project.urls]
Homepage = "https://github.com/openagentschool/ignitionstack"
Documentation = "https://openagentschool.org"
Repository = "https://github.com/openagentschool/ignitionstack"

[tool.setuptools.packages.find]
include = ["ignition*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
